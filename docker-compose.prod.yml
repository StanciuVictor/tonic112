# Production override. Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Real values are supplied at deploy time via the shell environment / a
# non-committed root .env file (see the "Go Live" GitHub Actions workflow,
# added in Epic 10) - only placeholder var NAMES live here.

services:
  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: always

  api:
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: 3000
      NODE_ENV: production
    restart: always

  nginx:
    restart: always
