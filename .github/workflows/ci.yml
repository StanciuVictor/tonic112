name: CI

# Runs on every PR into main: install, lint, test, build. Uses `nx affected`
# so a PR touching only one app doesn't waste time re-running the other -
# it also correctly re-runs both whenever libs/shared-types changes, since
# both apps depend on it. Never deploys - deployment pipelines are added in
# Epic 10 as separate, manually triggered workflows.
on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: nrwl/nx-set-shas@v5

      - name: Lint affected projects
        run: npx nx affected -t lint

      - name: Test affected projects
        run: npx nx affected -t test

      # Split per-project (rather than a blanket `affected -t build`)
      # because mobile has its own inferred "build" target for native EAS
      # builds, which needs credentials we don't have and isn't what we
      # want CI to trigger - "export" is the web build we actually want.
      - name: Build api
        run: npx nx affected -t build -p api

      - name: Build shared-types
        run: npx nx affected -t build -p shared-types

      - name: Build mobile (web export)
        run: npx nx affected -t export -p mobile
